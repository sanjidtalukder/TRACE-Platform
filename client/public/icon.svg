<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="trace-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <radialGradient id="trace-sweep-glow" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#B45309" stop-opacity="0" />
    </radialGradient>
    <filter id="trace-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Container with Amber Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#trace-bg)" stroke="#F59E0B" stroke-width="2.5" stroke-opacity="0.9" />

  <!-- Radar Concentric Rings -->
  <circle cx="32" cy="32" r="24" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="17" stroke="#F59E0B" stroke-width="1.4" stroke-opacity="0.55" />
  <circle cx="32" cy="32" r="9" stroke="#F59E0B" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Radar Crosshairs -->
  <line x1="32" y1="7" x2="32" y2="57" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.35" />
  <line x1="7" y1="32" x2="57" y2="32" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.35" />

  <!-- Radar Sweep Cone -->
  <path d="M32 32 L54 19 A25 25 0 0 0 32 7 Z" fill="url(#trace-sweep-glow)" />
  <line x1="32" y1="32" x2="54" y2="19" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" filter="url(#trace-glow)" />

  <!-- Sentinel Return Satellite Blip -->
  <circle cx="43" cy="23" r="2.8" fill="#38BDF8" filter="url(#trace-glow)" />
  <circle cx="43" cy="23" r="5" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.6" />

  <!-- Center Pulse Core -->
  <circle cx="32" cy="32" r="3.5" fill="#F59E0B" filter="url(#trace-glow)" />
  <circle cx="32" cy="32" r="1.8" fill="#FFFFFF" />
</svg>
